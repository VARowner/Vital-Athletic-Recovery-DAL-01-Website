<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TV Slideshow — Adrienne (Layout B: full-bleed overlay)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0b08;
    --ink-inverse: #f4eeda;
    --accent: #8a6536;
    --accent-soft: #b88a55;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #444; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; font-family: var(--sans); }
  .slide {
    width: 1920px; height: 1080px;
    background: #0d0b08 url('../../assets/instructors/adrienne-barrett.jpg') right center / cover no-repeat;
    color: var(--ink-inverse);
    position: relative;
    overflow: hidden;
  }
  /* Dark gradient from left edge (heavy) fading right */
  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(13,11,8,0.95) 0%, rgba(13,11,8,0.85) 30%, rgba(13,11,8,0.30) 65%, rgba(13,11,8,0.0) 100%);
    pointer-events: none;
  }
  /* Subtle bottom fade for URL bar legibility */
  .slide::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(13,11,8,0.0) 78%, rgba(13,11,8,0.60) 100%);
    pointer-events: none;
  }
  .content {
    position: relative;
    z-index: 2;
    max-width: 1000px;
    padding: 130px 90px 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: var(--accent-soft);
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 52px;
  }
  .eyebrow::before {
    content: '';
    width: 100px;
    height: 2px;
    background: var(--accent-soft);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 172px;
    line-height: 0.88;
    letter-spacing: -0.03em;
    color: var(--ink-inverse);
    text-shadow: 0 2px 40px rgba(13,11,8,0.85);
    margin-bottom: 44px;
  }
  h1 em {
    font-style: normal;
    color: var(--accent-soft);
    font-weight: 500;
  }
  .title {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent-soft);
    margin-bottom: 40px;
  }
  .bio {
    font-family: var(--serif);
    font-size: 34px;
    line-height: 1.45;
    color: rgba(244, 238, 218, 0.95);
    max-width: 780px;
    font-style: italic;
    text-shadow: 0 1px 24px rgba(13,11,8,0.75);
  }
  .url-bar {
    position: absolute;
    left: 90px;
    right: 90px;
    bottom: 60px;
    padding-top: 32px;
    border-top: 2px solid var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-inverse);
    z-index: 3;
  }
  .url-bar .right { color: var(--accent-soft); }
</style>
</head>
<body>
<div class="slide">
  <div class="content">
    <div class="eyebrow">Meet your instructor</div>
    <h1>Adrienne<br><em>Barrett.</em></h1>
    <div class="title">Reformer &middot; Strength &amp; Recovery</div>
    <p class="bio">&ldquo;Came to Pilates through my own rehab from a torn hip tendon. Now I teach it the way I needed it &mdash; intentional, full-body, built to last.&rdquo;</p>
  </div>
  <div class="url-bar">
    <span>vitalathleticrecovery.com</span>
    <span class="right">Book &rarr;</span>
  </div>
</div>
</body>
</html>
