<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VAR Social — Still Spots Open (Square 1080×1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-inverse: #f4eeda;
    --accent: #8a6536;
    --accent-soft: #b88a55;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #888;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
    font-family: var(--sans);
  }
  .post {
    width: 1080px; height: 1080px;
    background: #0d0b08 url('yoga-studio.jpg') center/cover no-repeat;
    color: var(--ink-inverse);
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
    padding: 88px 88px 0;
  }
  .post::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(13,11,8,0.80) 0%, rgba(13,11,8,0.55) 28%, rgba(13,11,8,0.18) 55%, rgba(13,11,8,0.30) 100%);
    pointer-events: none;
    z-index: 1;
  }
  .top { position: relative; z-index: 2; max-width: 800px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 22px; font-weight: 600;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--accent-soft);
    display: flex; align-items: center; gap: 24px;
    text-shadow: 0 1px 8px rgba(13,11,8,0.7);
  }
  .eyebrow::before {
    content: ''; width: 60px; height: 2px; background: var(--accent-soft);
  }
  /* Urgency pill — small mono badge near the eyebrow */
  .pill {
    display: inline-block;
    margin-top: 24px;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #0d0b08;
    background: var(--accent-soft);
    padding: 8px 16px;
    text-shadow: none;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 172px;
    line-height: 0.92;
    letter-spacing: -0.025em;
    margin-top: 36px;
    color: var(--ink-inverse);
    text-shadow: 0 2px 28px rgba(13,11,8,0.78), 0 1px 4px rgba(13,11,8,0.55);
  }
  h1 em {
    font-style: normal;
    color: var(--accent-soft);
    font-weight: 600;
  }
  .lede {
    font-family: var(--serif);
    font-size: 36px;
    color: rgba(244, 238, 218, 0.94);
    line-height: 1.4;
    margin-top: 44px;
    max-width: 760px;
    text-shadow: 0 1px 14px rgba(13,11,8,0.7), 0 1px 3px rgba(13,11,8,0.5);
  }
  .cta-bar {
    margin-top: auto;
    margin-left: -88px; margin-right: -88px;
    background: #0d0b08;
    color: var(--ink-inverse);
    padding: 56px 88px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(138, 101, 54, 0.45);
    position: relative; z-index: 2;
  }
  .cta-left { display: flex; flex-direction: column; gap: 8px; }
  .cta-eyebrow {
    font-family: var(--mono);
    font-size: 16px; font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent-soft);
  }
  .cta-url {
    font-family: var(--serif);
    font-size: 44px; font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink-inverse);
  }
  .cta-arrow {
    font-family: var(--serif);
    font-size: 84px; font-weight: 400;
    color: var(--accent-soft);
    line-height: 1;
  }
</style>
</head>
<body>
<div class="post">
  <div class="top">
    <div class="eyebrow">This Week's Classes</div>
    <div class="pill">Spots open · Book today</div>
    <h1>Spots still<br><em>open.</em></h1>
    <p class="lede">Reformer, Yoga, and MindBody. Small groups for the attention that you deserve. Book before they fill.</p>
  </div>
  <div class="cta-bar">
    <div class="cta-left">
      <div class="cta-eyebrow">Live Schedule</div>
      <div class="cta-url">vitalathleticrecovery.com</div>
    </div>
    <div class="cta-arrow">→</div>
  </div>
</div>
</body>
</html>
