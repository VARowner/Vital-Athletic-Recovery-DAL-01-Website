<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap');
  :root{
    --bg:#f2ebd8; --ink:#14110c; --ink-dim:#44403a; --ink-mute:#6f6a5c;
    --accent:#8a6536; --accent-deep:#4a3617; --line:rgba(20,17,12,0.12);
    --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
  .wrap{max-width:560px;width:100%;text-align:center}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,6vw,44px);
     line-height:1.1;margin:0 0 14px}
  .sub{color:var(--ink-dim);font-size:17px;line-height:1.55;margin:0 0 30px}
  ul{list-style:none;padding:0;margin:0 0 32px;text-align:left}
  li{position:relative;padding:14px 0 14px 30px;border-top:1px solid var(--line);
     color:var(--ink-dim);font-size:15px;line-height:1.55}
  li:last-child{border-bottom:1px solid var(--line)}
  li::before{content:"";position:absolute;left:6px;top:22px;width:7px;height:7px;
     border-radius:50%;background:var(--accent)}
  .btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
     font-weight:600;font-size:15px;padding:15px 30px;border-radius:2px;letter-spacing:.02em}
  .btn:hover{background:var(--accent-deep)}
  .muted{margin-top:26px;color:var(--ink-mute);font-size:13px;line-height:1.5}
  .muted a{color:var(--accent);text-decoration:underline}
  .spin{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--accent);
     border-radius:50%;margin:0 auto 22px;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
<div class="wrap">
  <div class="spin"></div>
  <h1>Taking you to checkout</h1>
  <p class="sub">One moment — sending you to the secure booking page for the Founder memberships.</p>
  <p class="muted">Not moving? <a id="manual" href="https://vitalathleticrecovery.gymmasteronline.com/portal/signup/1">Continue to checkout</a></p>
</div>
<script>
(function(){

  // ---- first-party event id, shared with the thank-you page ----
  var VAR_EID_COOKIE = 'var_eid';
  function varReadCookie(name) {
    var m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return m ? decodeURIComponent(m.pop()) : '';
  }
  function varWriteCookie(name, value, minutes) {
    var d = new Date(); d.setTime(d.getTime() + minutes * 60 * 1000);
    var domain = location.hostname.indexOf('vitalathleticrecovery.com') > -1
      ? '; domain=.vitalathleticrecovery.com' : '';
    document.cookie = name + '=' + encodeURIComponent(value) +
      '; expires=' + d.toUTCString() + '; path=/' + domain + '; SameSite=Lax';
  }
  function varNewId() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return 'var-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  var DEST = "https://vitalathleticrecovery.gymmasteronline.com/portal/signup/1";
  var CONTENT = {content_name:"Founder memberships",content_category:'membership',currency:'USD'};

  // Reuse an id if one is already in flight, so a back-and-forward through this
  // page does not orphan the id the thank-you page is going to look for.
  var eid = varReadCookie(VAR_EID_COOKIE) || varNewId();
  varWriteCookie(VAR_EID_COOKIE, eid, 120);
  varWriteCookie('var_offer', "founders", 120);

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({event:'ad_bounce', offer:"founders", event_id:eid});

  // The pixel reads fbclid off this URL and writes _fbc on our own domain.
  // That is the whole point of this page — GymMaster cannot do it for us.
  fbq('track','ViewContent',CONTENT,{eventID:eid+'-vc'});
    fbq('track','InitiateCheckout',CONTENT,{eventID:eid+'-ic'});

  // Carry any tracking params through to GymMaster untouched.
  var qs = location.search || '';
  var url = DEST + (qs ? (DEST.indexOf('?') > -1 ? '&' + qs.slice(1) : qs) : '');
  document.getElementById('manual').href = url;

  // Short delay so the pixel requests actually leave the browser first.
  setTimeout(function(){ location.replace(url); }, 450);
})();
</script>
</body>
